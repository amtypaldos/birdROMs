[project]
name = "birdroms-backend"
version = "0.1.0"
description = "Django backend for birdROMs"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.3",
    "Django>=5.0",
    "django-storages[s3]>=1.14",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
