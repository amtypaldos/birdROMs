# Publishes the production images to GitHub Container Registry (GHCR).
#
#   ghcr.io/<owner>/birdroms-backend   (backend/Dockerfile, target prod)
#   ghcr.io/<owner>/birdroms-web       (frontend/Dockerfile, target prod)
#
# Tags: every push to main -> `latest` and `sha-<7 chars>` (immutable, use it to pin or roll
# back); a version tag vX.Y.Z -> `X.Y.Z` and `latest`. Deploy by pointing a compose file at
# these images (see docs/deploying.md). Images are linux/amd64.
name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: birdroms-backend
            context: backend
          - image: birdroms-web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/${IMAGE}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            list="${repo}:${version},${repo}:latest"
          else
            list="${repo}:latest,${repo}:sha-${GITHUB_SHA::7}"
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
