# birdROMs CI: backend tests, frontend lint/test/build, and the production Docker images.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Tests run on PostgreSQL (same engine as dev/prod); Django creates test_birdroms here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: birdroms
          POSTGRES_USER: birdroms
          POSTGRES_PASSWORD: birdroms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birdroms -d birdroms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: birdroms
      POSTGRES_USER: birdroms
      POSTGRES_PASSWORD: birdroms
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      # Test mode uses the Postgres service above and a temp MEDIA_ROOT: no .env needed.
      - name: Run tests
        run: uv run python manage.py test

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 matches the project's dev toolchain (mise) and avoids a
          # jsdom/vitest VM module-linking failure (ERR_VM_MODULE_LINK_FAILURE)
          # seen on Node 22.
          node-version: "24"
      # Uses the Yarn version pinned in package.json's packageManager field.
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build

  docker:
    name: Production Docker images (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        # The published images are multi-arch (see docker-publish.yml); arm64 runs under QEMU.
        platform: [linux/amd64, linux/arm64]
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker buildx build --platform "$PLATFORM" --load --target prod -t birdroms-backend:ci backend
      - name: Backend runs as 568:568 by default, as PUID/PGID, or as compose `user:`
        run: |
          set -eu
          run() { docker run --rm --platform "$PLATFORM" "$@" birdroms-backend:ci sh -c 'echo "$(id -u):$(id -g)"'; }
          test "$(run)" = "568:568"
          test "$(run -e PUID=1234 -e PGID=4321)" = "1234:4321"
          test "$(run --user 2000:2000)" = "2000:2000"
          # The app's own folders follow PUID/PGID; a fresh volume starts as the image user.
          docker volume create puid-test
          docker run --rm --platform "$PLATFORM" -e PUID=1234 -e PGID=4321 -v puid-test:/data/media birdroms-backend:ci \
            sh -c 'touch /data/media/ok && test -w /app/staticfiles'
          docker volume rm puid-test
      - name: Build frontend image
        run: docker buildx build --platform "$PLATFORM" --load --target prod -t birdroms-web:ci frontend
      - name: Validate compose files
        run: scripts/check-compose.sh
